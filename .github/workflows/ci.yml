name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # The engine ships as AVAS.dll, so the smoke test (one short simulation) runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Check reviewed change records
        shell: pwsh
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:CHANGE_BASE -and $env:CHANGE_BASE -notmatch '^0+$') {
            python packaging/release_notes.py --base $env:CHANGE_BASE
          } else {
            python packaging/release_notes.py
          }
          if ($LASTEXITCODE -ne 0) { throw 'Add a reviewed change record before committing' }
      - name: Lint (ruff, defect rules only)
        run: python -m ruff check avas tests packaging
      - name: Fast tests
        run: >
          python -m pytest -q
          tests/test_design_rules.py tests/test_lattice_doc.py tests/test_run_diagnostics.py
          tests/test_live.py tests/test_ai.py tests/test_server.py tests/test_linear_optics.py
          tests/test_scan.py tests/test_smoke.py tests/test_updates.py tests/test_update_guard.py tests/test_release_notes.py tests/test_packaging.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type check and build
        run: npm run build

  publish-update:
    if: github.event_name == 'push' && github.repository == 'lycself/AVAS' && github.ref == 'refs/heads/main'
    needs: [python, frontend]
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: avas-update-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .[build]
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - run: python packaging/fetch_webview2.py
      - run: python packaging/build.py --require-installer
      - name: Verify packaged startup and update helper
        shell: pwsh
        run: |
          & dist/AVAS/AVAS.exe info
          if ($LASTEXITCODE -ne 0) { throw 'Packaged startup failed' }
          python packaging/test_update_helper.py
      - name: Publish fixed packages, then latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/update_release.py --publish
